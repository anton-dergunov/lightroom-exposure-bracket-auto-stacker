name: Release

# Push a tag such as v1.0.0 to publish that version. Info.lua must have the same version, and CHANGELOG.md a
# "## 1.0.0 (date)" section, which becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lua 5.1 (the version Lightroom runs)
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.1.5'
      - name: Run tests
        run: lua tests/lua/run.lua tests/fixtures/*/*.json tests/lua/test_*.lua
      - name: Check the version and extract release notes
        run: sh tools/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Build the plugin zip
        run: sh tools/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/bracket-stacker.zip
          --title "Bracket Stacker ${GITHUB_REF_NAME#v}" --notes-file notes.md
